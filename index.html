<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>小书童 Pagekin</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090A'/%3E%3Cpath d='M9 9h14v14H9z' fill='%235E6AD2'/%3E%3C/svg%3E" />
  </head>
  <body style="margin: 0;">
    <!-- 同步读取主题，避免加载页与主界面背景色闪跳 -->
    <script>
      (function() {
        var bgMap = { light: '#F9F9F8', galaxy: '#08090A', paper: '#F9F9F8', dark: '#08090A' };
        var theme = 'dark';
        try {
          var raw = localStorage.getItem('ai-novel-writer-appearance-v3');
          if (raw) {
            var profile = JSON.parse(raw);
            // 从旧版本迁来的配置不是用户主动选的，主题跟随新默认（深色），避免加载页与主界面闪跳
            var candidate = profile.origin === 'legacy-import' ? 'dark' : profile.colorTheme;
            if (Object.prototype.hasOwnProperty.call(bgMap, candidate)) {
              theme = candidate;
            }
          }
        } catch(e) {}

        var bg = bgMap[theme] || bgMap.dark;

        // 提前给 html 注入主题 class，确保所有全局 CSS 变量立即生效
        document.documentElement.classList.remove('light', 'dark', 'galaxy', 'paper');
        document.documentElement.classList.add(theme);

        document.body.style.backgroundColor = bg;
        /* 将背景色注入 CSS 变量供启动加载器引用 */
        document.documentElement.style.setProperty('--loader-bg', bg);
      })();
    </script>
    <div id="root">
      <style>
        .ai-writer-initial-loader {
          display: flex;
          flex-direction: column;
          justify-content: center;
          align-items: center;
          height: 100vh;
          width: 100vw;
          background-color: var(--loader-bg, #08090A);
          font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
          user-select: none;
        }

        .ai-writer-core-container {
          position: relative;
          width: 72px;
          height: 72px;
          display: flex;
          justify-content: center;
          align-items: center;
          margin-bottom: 24px;
        }

        .ai-writer-ring {
          position: absolute;
          width: 100%;
          height: 100%;
          border-radius: 50%;
          border: 2px solid transparent;
          border-top-color: rgba(94, 106, 210, .9);
          border-bottom-color: rgba(94, 106, 210, .22);
          animation: ai-writer-spin 2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .ai-writer-ring-inner {
          position: absolute;
          width: 65%;
          height: 65%;
          border-radius: 50%;
          border: 2px solid transparent;
          border-left-color: rgba(94, 106, 210, .5);
          border-right-color: rgba(255, 255, 255, .16);
          animation: ai-writer-spin-reverse 2.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .ai-writer-core {
          width: 12px;
          height: 12px;
          background: #5E6AD2;
          border-radius: 50%;
          box-shadow: 0 0 18px rgba(94, 106, 210, .45), 0 0 36px rgba(94, 106, 210, .2);
          animation: ai-writer-pulse 2s ease-in-out infinite;
        }

        .ai-writer-text {
          font-size: 12px;
          font-weight: 500;
          letter-spacing: 4px;
          text-transform: uppercase;
          background: linear-gradient(90deg, #62666D, #F7F8F8, #62666D);
          background-size: 200% auto;
          color: transparent;
          -webkit-background-clip: text;
          background-clip: text;
          animation: ai-writer-text-shine 3s linear infinite;
        }

        @keyframes ai-writer-spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes ai-writer-spin-reverse {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }

        @keyframes ai-writer-pulse {
          0%, 100% { transform: scale(0.85); opacity: .85; box-shadow: 0 0 12px rgba(94, 106, 210, .35); }
          50% { transform: scale(1.2); opacity: 1; box-shadow: 0 0 26px rgba(94, 106, 210, .55), 0 0 48px rgba(94, 106, 210, .28); }
        }

        @keyframes ai-writer-text-shine {
          to { background-position: 200% center; }
        }
      </style>
      <div class="ai-writer-initial-loader">
        <div class="ai-writer-core-container">
          <div class="ai-writer-ring"></div>
          <div class="ai-writer-ring-inner"></div>
          <div class="ai-writer-core"></div>
        </div>
        <div class="ai-writer-text">正在启动</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
